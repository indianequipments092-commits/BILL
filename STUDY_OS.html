<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<title>STUDY OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090B12;--side:#0E1120;--card:#151A2A;--card2:#1B2136;--line:rgba(255,255,255,.07);--acc:#8875FF;--acc2:#53D6FF;--ok:#36D6A0;--warn:#FFBD69;--danger:#FF657A;--tx:#F5F6FF;--tx2:#969DB2;--on:#fff;--r:16px;
--fh:Manrope,"Segoe UI",system-ui,sans-serif;--fb:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--ft:"Space Grotesk",ui-monospace,Consolas,monospace;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=oled]{--bg:#000;--side:#000;--card:#0B0C12;--card2:#12141D}
:root[data-theme=purple]{--bg:#0F0720;--side:#150A2B;--card:#1E1138;--card2:#281848;--acc:#B18CFF;--acc2:#FF8AD8}
:root[data-theme=blue]{--bg:#050D1F;--side:#091530;--card:#0E1E40;--card2:#14295A;--acc:#5AA2FF;--acc2:#53E0D0}
:root[data-theme=light]{--bg:#F3F4FB;--side:#FFFFFF;--card:#FFFFFF;--card2:#EEF0F8;--line:rgba(20,24,50,.1);--acc:#6A55F0;--acc2:#0A97C9;--ok:#15A87A;--warn:#C27A12;--danger:#D93A55;--tx:#141832;--tx2:#5B6280;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:400 14px/1.55 var(--fb);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:var(--sw,248px) 1fr;height:100%;transition:grid-template-columns .22s}
[data-motion=off] *{transition:none!important;animation:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:hidden;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font:800 17px var(--fh);white-space:nowrap}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#0a0c14;flex:none}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--tx2);text-align:left;white-space:nowrap;width:100%;transition:background .15s,color .15s}
.nl:hover{background:var(--card);color:var(--tx)}
.nl[aria-current=page]{background:var(--card2);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
.nl[aria-current=page] .ic{color:var(--acc)}
.collapsed{--sw:76px}
.collapsed .lbl,.collapsed .brand span.t{display:none}
.collapsed .nl{justify-content:center;padding:12px 0}
.collapsed #col .ic{transform:rotate(180deg)}
/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line);position:relative}
.sbox{flex:1;max-width:420px;position:relative}
.sbox .ic{position:absolute;left:12px;top:10px;color:var(--tx2)}
.sbox input{width:100%;height:40px;padding:0 54px 0 40px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline-offset:2px}
.kbd{position:absolute;right:10px;top:9px;font:500 11px var(--fm);color:var(--tx2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.res{position:absolute;top:46px;left:0;right:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:20;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.res button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px}
.res button:hover,.res button:focus-visible{background:var(--card)}
.sp{flex:1}
.clock{text-align:right;line-height:1.2}
.clock b{font:500 17px var(--fm);display:block}
.clock span{font-size:12px;color:var(--tx2)}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--tx2);position:relative}
.ib:hover{color:var(--tx);background:var(--card2)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--acc);border-color:transparent;color:var(--on);font-weight:600}
.btn.d{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.view{flex:1;overflow-y:auto;padding:28px 24px 40px}
.wrap{max-width:1080px;margin:0 auto}
h1{font:800 28px/1.2 var(--fh);margin:0 0 6px;letter-spacing:-.01em}
h2{font:700 16px var(--fh);margin:0 0 10px}
.sub{color:var(--tx2);margin:0 0 24px;max-width:62ch}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.big{grid-column:span 2}
.card h2{display:flex;align-items:center;gap:8px;color:var(--tx2);font-weight:600;font-size:13px}
.stat{font:700 34px var(--ft);letter-spacing:-.02em}
.mut{color:var(--tx2);font-size:13px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--tx2);font-size:13px;margin-top:8px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.d{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.ul{margin:10px 0 0;padding-left:18px;color:var(--tx2)}
.ul li{margin:3px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.th{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:10px;text-align:left}
.th[aria-pressed=true]{border-color:var(--acc)}
.sw{height:44px;border-radius:9px;margin-bottom:8px;display:flex;overflow:hidden}
.sw i{flex:1}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw2{width:46px;height:26px;border-radius:99px;border:0;background:var(--card2);position:relative;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--tx2);transition:transform .18s}
.sw2[aria-checked=true]{background:var(--acc)}
.sw2[aria-checked=true]::after{transform:translateX(20px);background:#fff}
.fld{display:block;margin:8px 0}
.fld input{width:100%;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.ring{width:84px;height:84px}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .tr{stroke:var(--card2)}
.ring .pg{stroke:var(--acc);stroke-dasharray:226;stroke-dashoffset:79;transform:rotate(-90deg);transform-origin:50% 50%}
.timer{font:700 56px var(--ft);letter-spacing:-.03em}
.dg{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:16px}
.dg .w{display:flex;flex-direction:column;gap:6px;min-width:0}
.cp .card{padding:12px}.cp .stat{font-size:24px}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:9px}
.wt{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.edit .w{outline:1px dashed var(--acc);outline-offset:-1px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
textarea.qn{width:100%;min-height:96px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px}
.mc{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}.mc b{color:var(--tx2);font-weight:500}.mc span{padding:5px 0;border-radius:8px}.mc .td{background:var(--acc);color:var(--on);font-weight:600}
.qa2{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0}
.tb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tb input,.tb select{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px}.tb input{flex:1;min-width:160px}
.tl{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.kb{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(240px,1fr));overflow-x:auto;align-items:start}.kb>div{display:flex;flex-direction:column;gap:10px}
.tk{display:flex;flex-direction:column;gap:8px}.tk h3{font:600 15px var(--fh);margin:0;display:flex;gap:10px;align-items:flex-start}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--tx2);background:none;flex:none;display:grid;place-items:center;color:var(--on);padding:0;margin-top:1px}.ck[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}.ck .ic{width:14px;height:14px;stroke-width:3}
.tk.dn h3 span{text-decoration:line-through;color:var(--tx2)}
.sbt{display:flex;gap:8px;align-items:center;background:none;border:0;padding:2px 0;text-align:left;color:var(--tx2);font-size:13px}
.sbt[aria-pressed=true]{text-decoration:line-through}
.sbt i{width:14px;height:14px;border-radius:4px;border:2px solid var(--tx2);flex:none}.sbt[aria-pressed=true] i{background:var(--ok);border-color:var(--ok)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.fw{grid-column:1/-1}
.fld select,.fld textarea{width:100%;min-height:40px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
@media(max-width:520px){.fg{grid-template-columns:1fr}}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(440px,100%);max-height:85vh;overflow:auto}
.pan{position:absolute;right:24px;top:62px;width:min(340px,calc(100vw - 32px));background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:16px;z-index:30;box-shadow:0 16px 40px rgba(0,0,0,.4)}
.toasts{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center}
.toast{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--acc2);padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.bnav{display:none}
@media(max-width:1100px){.app{--sw:76px}.app .lbl,.app .brand span.t{display:none}.app .nl{justify-content:center;padding:12px 0}#col{display:none}}
@media(max-width:760px){
.app{grid-template-columns:1fr}.side{display:none}
.top{padding:10px 14px;gap:8px}.clock{display:none}.sbox .kbd{display:none}.sbox input{padding-right:12px}
.view{padding:20px 14px 28px}.card.big{grid-column:auto}
.bnav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--side);border-top:1px solid var(--line);padding:6px 4px}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--tx2);font-size:11px;padding:6px 0;border-radius:10px}
.bnav button[aria-current=page]{color:var(--acc)}
.pan{right:14px}
}
.kb>div{min-height:120px}
.ti{display:flex;flex-direction:column;gap:1px;padding:6px 8px;border-radius:9px;background:var(--card2);border-left:3px solid var(--acc);font-size:12px;cursor:pointer;min-width:0}
.ti b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ti span{color:var(--tx2);font-size:11px}
.ti.dn{opacity:.55}.ti.dn b{text-decoration:line-through}.ti.cf{border-left-color:var(--danger)}
.tt{font:700 16px var(--fh);margin:0 8px}
.wk,.mg{display:grid;gap:8px;grid-template-columns:repeat(7,minmax(140px,1fr));overflow-x:auto}
.mg{gap:6px;grid-template-columns:repeat(7,minmax(0,1fr))}
.tcol{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:120px;min-width:0}
.tcol.tdy{border-color:var(--acc)}.tcol.off{opacity:.45}
.mg .tcol{min-height:92px;padding:6px}.mg .ti{padding:3px 6px}
.dh{background:none;border:0;text-align:left;font-weight:600;color:var(--tx);padding:2px}
.cnt{display:none}
.hrw{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:start;border-top:1px solid var(--line);padding:8px 0;min-height:44px}
.hrw .col{display:flex;flex-direction:column;gap:6px}
@media(max-width:520px){.mg .ti{display:none}.mg .cnt{display:block;font-size:11px;color:var(--acc)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-command" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></symbol>
<symbol id="i-tasks" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.3 1.3L7 5M3.5 12l1.3 1.3L7 11M3.5 18l1.3 1.3L7 17"/></symbol>
<symbol id="i-timetable" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="i-focus" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></symbol>
<symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
<symbol id="i-subjects" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 20a2 2 0 0 0 2 2h13v-4"/></symbol>
<symbol id="i-planner" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>

<symbol id="i-notes" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></symbol>
<symbol id="i-preferences" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
<symbol id="i-components" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/><circle cx="17" cy="7" r="4"/><path d="M5 15l2-2 2 2-2 2z"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</defs></svg>

<div class="app" id="app">
  <aside class="side" aria-label="Primary">
    <div class="brand"><div class="logo"><svg class="ic"><use href="#i-focus"/></svg></div><span class="t">STUDY OS</span></div>
    <nav class="nav" id="nav"></nav>
    <button class="nl" id="col" aria-label="Collapse sidebar"><svg class="ic"><use href="#i-chev"/></svg><span class="lbl">Collapse</span></button>
  </aside>
  <div class="main">
    <header class="top">
      <div class="sbox"><svg class="ic"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search sections" aria-label="Global search" autocomplete="off"><span class="kbd">Ctrl K</span><div class="res" id="res" hidden></div></div>
      <div class="sp"></div>
      <div class="clock"><b id="ck">--:--</b><span id="dt"></span></div>
      <button class="btn p" id="qa"><svg class="ic"><use href="#i-plus"/></svg><span class="lbl">Quick Add</span></button>
      <button class="ib" id="nf" aria-label="Notifications" aria-expanded="false"><svg class="ic"><use href="#i-bell"/></svg></button>
      <button class="ib" id="fr" aria-label="Open Focus Room"><svg class="ic"><use href="#i-focus"/></svg></button>
      <button class="ib" id="st" aria-label="Open Settings"><svg class="ic"><use href="#i-preferences"/></svg></button>
      <div class="pan" id="pan" hidden><h2>Notifications</h2><div class="empty">Nothing yet. Reminders and break alerts will show up here once the reminder engine is built (Phase 9).</div></div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
    <nav class="bnav" id="bnav" aria-label="Mobile"></nav>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var ic=function(n){return '<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>'};
var LS={get:function(k,d){try{var v=localStorage.getItem('sos.'+k);return v===null?d:v}catch(e){return d}},set:function(k,v){try{localStorage.setItem('sos.'+k,v)}catch(e){}}};

/* ---------- sections registry ---------- */
var S=[
["command","Command Center",2,"Your day at a glance: tasks, focus time, streak and goals."],
["tasks","My Tasks",3,"Create, organise and track study tasks.",["Priorities, labels, subtasks","List, calendar, kanban views","Search, filter, archive"]],
["timetable","Timetable",4,"Daily, weekly and monthly study schedule.",["Conflict detection","Recurring sessions","Drag to reschedule"]],
["focus","Focus Room",6,"Distraction-free fullscreen timer on pure black.",["Countdown, stopwatch, Pomodoro","Seven timer styles","Timestamp-based, refresh-safe timing"]],
["music","Music Studio",7,"Ambience, focus audio and your own tracks in one mixer.",["Rain, wind, noise layers","Your own audio files","Sleep timer and saved mixes"]],
["subjects","Subjects",8,"Subject, chapter and topic organisation.",["Subject → Chapter → Topic → Task","Clear completion rules"]],
["planner","Study Planner",8,"Plan days and weeks, with suggestions you review.",["Revision scheduling","Daily and weekly targets"]],
["goals","Goals",8,"Study targets, milestones and exam countdowns."],
["analytics","Analytics",10,"Reports built only from recorded study time.",["Daily, weekly, monthly","PDF and CSV export"]],
["history","History",5,"Past tasks and study sessions.",["Planned vs actual duration"]],
["notes","Notes",11,"Quick study notes and session notes."],
["preferences","Settings",1,"Appearance and behaviour."]
];
var ID={};S.forEach(function(s){ID[s[0]]=s});
var MOB=["command","tasks","focus","music"];

/* ---------- shared components ---------- */
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(function(){t.remove()},2800)}
var lastFocus=null;
function modal(html){closeModal();lastFocus=document.activeElement;var o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';o.addEventListener('click',function(e){if(e.target===o)closeModal()});document.body.appendChild(o);var f=o.querySelector('button,input');if(f)f.focus()}

V.tasks=function(){var subj=[];tasks().forEach(function(x){if(x.subject&&subj.indexOf(x.subject)<0)subj.push(x.subject)});

/* ---------- timetable (Phase 4) ---------- */
var TT={v:'week',d:todayStr()};
function p2(n){return String(n).padStart(2,'0')}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function fd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function ad(s,n){var d=pd(s);d.setDate(d.getDate()+n);return fd(d)}
function mn(x){if(!x)return null;var p=x.split(':');return +p[0]*60+ +p[1]}
function occ(ds){return tasks().filter(function(t){if(t.archived||!t.date)return false;if(t.date===ds)return true;var r=t.rep;if(!r||r==='None'||ds<t.date)return false;var w=pd(ds).getDay();if(r==='Daily')return true;if(r==='Weekdays')return w>0&&w<6;return r==='Weekly'&&w===pd(t.date).getDay()}).sort(function(a,b){return (a.start||'99')<(b.start||'99')?-1:1})}
function span(t){var s=mn(t.start);if(s===null)return null;var e=mn(t.end);if(e===null)e=s+(parseInt(t.dur,10)||60);return [s,e]}
function clash(L){var o={};L=L.filter(function(t){return t.status!=='done'});L.forEach(function(a,i){var x=span(a);if(!x)return;L.forEach(function(b,j){if(j<=i)return;var y=span(b);if(y&&x[0]<y[1]&&y[0]<x[1]){o[a.id]=1;o[b.id]=1}})});return o}
function tti(t,ds,cl){var r=t.rep&&t.rep!=='None',mv2=!(r&&t.date!==ds)&&t.status!=='done';return '<div class="ti'+(t.status==='done'?' dn':'')+(cl[t.id]?' cf':'')+'" role="button" tabindex="0" draggable="'+mv2+'" data-ti="'+t.id+'"><b>'+esc(t.title)+'</b><span>'+(t.start?t.start+(t.end?'\u2013'+t.end:''):'No time')+(r?' \u21bb':'')+(cl[t.id]?' \u00b7 Overlap':'')+'</span></div>'}
function ttl(){var d=pd(TT.d);if(TT.v==='day')return d.toLocaleDateString([], {weekday:'long',day:'numeric',month:'long',year:'numeric'});if(TT.v==='month')return d.toLocaleDateString([], {month:'long',year:'numeric'});var m=ad(TT.d,-((d.getDay()+6)%7)),e=pd(ad(m,6));return pd(m).toLocaleDateString([], {day:'numeric',month:'short'})+' \u2013 '+e.toLocaleDateString([], {day:'numeric',month:'short',year:'numeric'})}
V.timetable=function(){var h='<div class="tb"><button class="btn" data-t="prev" aria-label="Previous">\u2039</button><button class="btn" data-t="today">Today</button><button class="btn" data-t="next" aria-label="Next">\u203a</button><b class="tt">'+ttl()+'</b><span class="sp"></span>'+[['day','Day'],['week','Week'],['month','Month']].map(function(x){return '<button class="btn'+(TT.v===x[0]?' p':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>'}).join('')+'<button class="btn p" data-t="add">New task</button></div>',td=todayStr(),i,ds,L,cl;
 if(TT.v==='day'){L=occ(TT.d);cl=clash(L);var any=L.filter(function(t){return !t.start});
  h+='<div class="card"><div class="mut">'+L.length+' scheduled'+(Object.keys(cl).length?' \u00b7 <span style="color:var(--danger)">overlaps found</span>':'')+'. Planned schedule only; recorded study time lives in History.</div>';
  h+='<div class="hrw" data-drop="'+TT.d+'"><span class="mut">Anytime</span><div class="col">'+(any.map(function(t){return tti(t,TT.d,cl)}).join('')||'<span class="mut">Nothing without a time.</span>')+'</div><span></span></div>';
  for(i=5;i<24;i++){(function(hr){var m=L.filter(function(t){var s=mn(t.start);return s!==null&&Math.max(5,Math.floor(s/60))===hr});h+='<div class="hrw" data-drop="'+TT.d+'" data-h="'+hr+'"><span class="mut">'+p2(hr)+':00</span><div class="col">'+m.map(function(t){return tti(t,TT.d,cl)}).join('')+'</div><button class="btn sm" data-ad="'+TT.d+'" data-h="'+hr+'" aria-label="Add task at '+p2(hr)+':00">+</button></div>'})(i)}
  h+='</div>'}
 else if(TT.v==='week'){var m0=ad(TT.d,-((pd(TT.d).getDay()+6)%7));h+='<div class="wk">';for(i=0;i<7;i++){ds=ad(m0,i);L=occ(ds);cl=clash(L);h+='<div class="tcol'+(ds===td?' tdy':'')+'" data-drop="'+ds+'"><button class="dh" data-d="'+ds+'">'+pd(ds).toLocaleDateString([], {weekday:'short',day:'numeric'})+'</button>'+L.map(function(t){return tti(t,ds,cl)}).join('')+'<button class="btn sm" data-ad="'+ds+'" aria-label="Add task on '+ds+'">+ Add</button></div>'}h+='</div>'}
 else{var f=pd(TT.d);f.setDate(1);var st=ad(fd(f),-((f.getDay()+6)%7)),mo=f.getMonth();h+='<div class="mg">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(x){return '<b class="mut" style="text-align:center">'+x+'</b>'}).join('');
  for(i=0;i<42;i++){ds=ad(st,i);if(i%7===0&&i>0&&pd(ds).getMonth()!==mo&&pd(ds)>f)break;L=occ(ds);cl=clash(L);h+='<div class="tcol'+(ds===td?' tdy':'')+(pd(ds).getMonth()!==mo?' off':'')+'" data-drop="'+ds+'"><button class="dh" data-d="'+ds+'">'+pd(ds).getDate()+'</button>'+L.slice(0,2).map(function(t){return tti(t,ds,cl)}).join('')+(L.length>2?'<span class="mut" style="font-size:11px">+'+(L.length-2)+' more</span>':'')+(L.length?'<span class="cnt">'+L.length+' task'+(L.length>1?'s':'')+'</span>':'')+'</div>'}h+='</div>'}
 return h+'<p class="mut" style="margin-top:12px">Drag a task to another day to reschedule it (desktop). Overlaps are flagged, never changed automatically. Recurring tasks are edited from the task itself.</p>'};
function mv(id,ds,hr){var A=tasks(),t=A.filter(function(x){return x.id===id})[0];if(!t||(t.date===ds&&hr==null))return;
 if(t.rep&&t.rep!=='None'){toast('Recurring task. Edit it to change its schedule.');return}
 if(hr!=null){if(t.start){var s=mn(t.start),e=mn(t.end);t.start=p2(hr)+':00';if(e!==null){var ne=hr*60+(e-s);t.end=ne<1440?p2(Math.floor(ne/60))+':'+p2(ne%60):''}}else t.start=p2(hr)+':00'}

/* ---------- router ---------- */
var cur='command';
